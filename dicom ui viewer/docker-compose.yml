  celery-worker:
    build: ./backend
    container_name: medview_celery_worker
    volumes:
      - ./backend:/workspace
    env_file:
      - ./backend/.env.production
    command: celery -A app.worker worker --loglevel=info -Q default,thumbnail_queue,ai_queue,upload_queue,export_queue
    depends_on:
      db-postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    container_name: medview_celery_beat
    volumes:
      - ./backend:/workspace
    env_file:
      - ./backend/.env.production
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      db-postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy

